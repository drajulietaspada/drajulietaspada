<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex,nofollow,noarchive,nosnippet" />
    <meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet" />
    <meta name="theme-color" content="#f6e4e8" />
    <meta name="description" content="Una invitación privada de Spada Dermatología & Estética." />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Tenés un regalo de SPADA 💌" />
    <meta property="og:description" content="Una invitación privada por el Día de la Madre." />
    <meta property="og:url" content="https://spada.com.ar/regalo/mama-2026-spada/" />

    <title>Un regalo para vos | SPADA</title>

    <link rel="icon" type="image/png" href="../../images/isologo-negro.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>

  <body>
    <main class="gift-page">
      <section class="gift-experience" aria-label="Regalo por el Día de la Madre">
        <div class="envelope-scene">
          <div class="envelope" data-envelope>
            <div class="envelope__back" aria-hidden="true"></div>

            <article
              class="gift-letter"
              id="gift-letter"
              data-letter
              aria-hidden="true"
              aria-label="Carta de regalo de Spada Dermatología y Estética"
            >
              <div class="gift-letter__lace" aria-hidden="true"></div>
              <div class="gift-letter__content gift-card-copy">
                <p class="gift-card-copy__label">Gift Card</p>
                <p class="gift-card-copy__amount">$150.000</p>
                <p class="gift-card-copy__intro">Para usar en tu próximo tratamiento:</p>
                <p class="gift-card-copy__treatments">
                  Revive <span aria-hidden="true">·</span> Radiesse <span aria-hidden="true">·</span> Toxina botulínica
                </p>
                <p class="gift-card-copy__validity">Válido del 13/10 al 16/10</p>
              </div>
            </article>

            <div class="envelope__flap envelope__flap--left" aria-hidden="true"></div>
            <div class="envelope__flap envelope__flap--right" aria-hidden="true"></div>
            <div class="envelope__flap envelope__flap--bottom" aria-hidden="true"></div>
            <div class="envelope__flap envelope__flap--top" aria-hidden="true"></div>

            <button
              class="wax-seal"
              type="button"
              data-seal
              aria-expanded="false"
              aria-controls="gift-letter"
              aria-label="Abrir la carta y ver tu regalo"
            >
              <svg viewBox="0 0 280 230" role="img" aria-label="Sello de cera SPADA">
                <defs>
                  <linearGradient id="waxFill" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#d31324" />
                    <stop offset="38%" stop-color="#a90718" />
                    <stop offset="100%" stop-color="#6f0010" />
                  </linearGradient>
                  <linearGradient id="waxRim" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#ff6671" />
                    <stop offset="26%" stop-color="#a70014" />
                    <stop offset="72%" stop-color="#69000d" />
                    <stop offset="100%" stop-color="#d7192e" />
                  </linearGradient>
                  <filter id="waxShadow" x="-30%" y="-30%" width="160%" height="170%">
                    <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#52000b" flood-opacity=".34" />
                  </filter>
                  <clipPath id="sealLogoClip">
                    <path d="M140 193C118 173 47 133 47 78C47 50 67 34 92 34C113 34 130 46 140 66C150 46 167 34 188 34C213 34 233 50 233 78C233 133 162 173 140 193Z" />
                  </clipPath>
                </defs>

                <path
                  d="M140 218C115 190 23 142 23 73C23 32 53 10 88 10C110 10 129 21 140 43C151 21 170 10 192 10C227 10 257 32 257 73C257 142 165 190 140 218Z"
                  fill="url(#waxRim)"
                  filter="url(#waxShadow)"
                />
                <path
                  d="M140 199C116 176 40 135 40 76C40 45 62 28 90 28C112 28 130 41 140 61C150 41 168 28 190 28C218 28 240 45 240 76C240 135 164 176 140 199Z"
                  fill="url(#waxFill)"
                  stroke="#f04452"
                  stroke-opacity=".55"
                  stroke-width="2"
                />
                <path
                  d="M57 60C74 27 111 31 131 57"
                  fill="none"
                  stroke="#ff8a92"
                  stroke-opacity=".48"
                  stroke-width="5"
                  stroke-linecap="round"
                />
                <circle cx="79" cy="70" r="3.6" fill="#6e0010" opacity=".72" />
                <circle cx="203" cy="66" r="4.5" fill="#e53d49" opacity=".46" />
                <circle cx="210" cy="116" r="2.6" fill="#5f000d" opacity=".58" />

                <image
                  href="../../images/isologo-blanco.png"
                  x="56"
                  y="86"
                  width="168"
                  height="50"
                  preserveAspectRatio="xMidYMid slice"
                  clip-path="url(#sealLogoClip)"
                  opacity="1"
                />
              </svg>
            </button>
          </div>
        </div>

        <button class="gift-instruction" type="button" data-toggle>
          <span class="gift-instruction__text" data-instruction>
            Hacé click en el sello para abrir y ver tu regalo
          </span>
          <span class="gift-instruction__icon" aria-hidden="true">↗</span>
        </button>
      </section>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
